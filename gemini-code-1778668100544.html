<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Visualizzatore Probabilità Monty Hall</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Area Bicchieri */
        .bicchieri-wrap { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .bicchiere { width: 100px; height: 130px; background: #3498db; border-radius: 10px; cursor: pointer; 
                    display: flex; align-items: center; justify-content: center; font-size: 45px; transition: 0.2s; }
        .bicchiere.scelto { border: 5px solid #f1c40f; transform: scale(1.05); }
        .bicchiere.aperto { background: #dcdde1; opacity: 0.5; cursor: default; }
        .bicchiere.vincitore { background: #2ecc71; }

        /* Grafici della Probabilità */
        .prob-container { margin-top: 30px; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 15px; }
        .label-grafico { margin-bottom: 5px; font-weight: bold; display: flex; justify-content: space-between; }
        .barra-sfondo { width: 100%; height: 25px; background: #eee; border-radius: 12px; margin-bottom: 15px; overflow: hidden; border: 1px solid #ddd; }
        .barra-riempimento { height: 100%; width: 0%; transition: width 0.5s ease-out; }
        #barra-resta { background: #95a5a6; }
        #barra-cambia { background: #e67e22; }

        button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-cambia { background: #e67e22; color: white; }
        .btn-resta { background: #34495e; color: white; }
        .btn-reset { background: #2ecc71; color: white; margin-top: 15px; }
        .nascosto { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Visualizza la Probabilità</h1>
    <p id="status">Clicca su un bicchiere per iniziare</p>
    
    <div class="bicchieri-wrap">
        <div class="bicchiere" id="b0" onclick="seleziona(0)">🥤</div>
        <div class="bicchiere" id="b1" onclick="seleziona(1)">🥤</div>
        <div class="bicchiere" id="b2" onclick="seleziona(2)">🥤</div>
    </div>

    <div id="controlli" class="nascosto">
        <button class="btn-resta" onclick="faseFinale(false)">Resta</button>
        <button class="btn-cambia" onclick="faseFinale(true)">Cambia</button>
    </div>
    
    <button id="reset" class="btn-reset nascost" onclick="reset()">Prossimo Round</button>

    <div class="prob-container">
        <h3>Statistiche in tempo reale:</h3>
        
        <div class="label-grafico">
            <span>Strategia RESTA (Vittorie)</span>
            <span id="txt-resta">0%</span>
        </div>
        <div class="barra-sfondo"><div id="barra-resta" class="barra-riempimento"></div></div>

        <div class="label-grafico">
            <span>Strategia CAMBIA (Vittorie)</span>
            <span id="txt-cambia">0%</span>
        </div>
        <div class="barra-sfondo"><div id="barra-cambia" class="barra-riempimento"></div></div>
        
        <small>* La probabilità teorica è 33% vs 66%. Più giochi, più le barre si avvicineranno a questi valori.</small>
    </div>
</div>

<script>
    let premio, scelto, fase = 1;
    let dati = { resta: {v: 0, t: 0}, cambia: {v: 0, t: 0} };

    function seleziona(i) {
        if(fase !== 1) return;
        scelto = i;
        document.getElementById('b'+i).classList.add('scelto');
        
        let vuoti = [0,1,2].filter(x => x !== scelto && x !== premio);
        let apri = vuoti[Math.floor(Math.random()*vuoti.length)];
        
        document.getElementById('b'+apri).classList.add('aperto');
        document.getElementById('b'+apri).innerText = "❌";
        
        document.getElementById('status').innerText = "Ho eliminato un bicchiere vuoto. Ora scegli:";
        document.getElementById('controlli').classList.remove('nascosto');
        fase = 2;
    }

    function faseFinale(cambia) {
        if(fase !== 2) return;
        let finale = scelto;
        if(cambia) {
            let aperto = parseInt(document.querySelector('.aperto').id.replace('b',''));
            finale = [0,1,2].find(x => x !== scelto && x !== aperto);
        }

        let vinto = (finale === premio);
        let cat = cambia ? dati.cambia : dati.resta;
        cat.t++; if(vinto) cat.v++;

        // Aggiorna Grafica
        aggiornaBarre();
        
        // Mostra Risultato
        for(let i=0; i<3; i++) {
            let b = document.getElementById('b'+i);
            b.innerText = (i === premio) ? "🍫" : "❌";
            if(i === premio) b.classList.add('vincitore');
        }
        
        document.getElementById('status').innerText = vinto ? "HAI VINTO!" : "HAI PERSO!";
        document.getElementById('controlli').classList.add('nascosto');
        document.getElementById('reset').classList.remove('nascosto');
        fase = 3;
    }

    function aggiornaBarre() {
        let pResta = dati.resta.t > 0 ? (dati.resta.v / dati.resta.t * 100) : 0;
        let pCambia = dati.cambia.t > 0 ? (dati.cambia.v / dati.cambia.t * 100) : 0;
        
        document.getElementById('barra-resta').style.width = pResta + "%";
        document.getElementById('txt-resta').innerText = Math.round(pResta) + "%";
        
        document.getElementById('barra-cambia').style.width = pCambia + "%";
        document.getElementById('txt-cambia').innerText = Math.round(pCambia) + "%";
    }

    function reset() {
        premio = Math.floor(Math.random()*3);
        fase = 1;
        document.querySelectorAll('.bicchiere').forEach(b => {
            b.className = 'bicchiere';
            b.innerText = '🥤';
        });
        document.getElementById('status').innerText = "Scegli un bicchiere";
        document.getElementById('controlli').classList.add('nascosto');
        document.getElementById('reset').classList.add('nascosto');
    }

    reset();
</script>
</body>
</html>
